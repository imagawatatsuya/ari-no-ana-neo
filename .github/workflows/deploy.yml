name: Deploy production site

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  deploy:
    needs: validate
    environment:
      name: ${{ vars.ARI_DEPLOY_TARGET == 'workers' && 'cloudflare-workers' || 'github-pages' }}
      url: ${{ vars.ARI_DEPLOY_TARGET == 'workers' && 'https://ari.denmei.org/' || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Use HTTPS for public git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          
      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check production Data API
        run: node scripts/check-supabase.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify production DB security
        run: node scripts/check-security.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        
      - name: Build
        run: npm run build
        env:
          # GitHubのリポジトリSettings > Secrets and variables > Actions に
          # 以下の名前でSecretを登録してください。
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          
      - name: Setup Pages
        if: vars.ARI_DEPLOY_TARGET != 'workers'
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        if: vars.ARI_DEPLOY_TARGET != 'workers'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        if: vars.ARI_DEPLOY_TARGET != 'workers'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy to Cloudflare Workers
        if: vars.ARI_DEPLOY_TARGET == 'workers'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install wrangler deploy
